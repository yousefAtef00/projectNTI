<div class="card product-card h-100 shadow-sm">
  <div class="image-container">
    <img [src]="product.image" class="card-img-top product-image" alt="{{ product.title }}" />
  </div>

  <div class="card-body d-flex flex-column">
    
    <h4 class="product-title">
      {{ product.title }}
    </h4>

    <p class="product-description text-muted">
      {{ product.description }}
    </p>

    <div class="mt-auto">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="text-success fw-bold mb-0">{{ product.price }} EGP</h5>
      </div>

      <p class="stock-text">Stock: {{ product.stock }}</p>

      @if (showLoginMessage()) {
        <div class="alert alert-warning py-2 px-2 mb-2">Please login first</div>
      }

      <button
        class="btn btn-primary w-100 add-cart-btn"
        (click)="addToCart()"
        [disabled]="product.stock === 0"
      >
        🛒 Add To Cart
      </button>
    </div>
    
  </div>
</div>
